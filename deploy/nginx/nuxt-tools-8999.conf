server {
    listen 8999;
    server_name _;

    root /usr/share/nginx/html/nuxt-tools;
    index index.html;

    location ^~ /tools/_nuxt/ {
        alias /usr/share/nginx/html/nuxt-tools/_nuxt/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /tools/favicon.svg {
        alias /usr/share/nginx/html/nuxt-tools/favicon.svg;
        expires 7d;
    }

    location /ws {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA: all /tools/* routes serve /tools/index.html
    location /tools/ {
        try_files $uri /tools/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
