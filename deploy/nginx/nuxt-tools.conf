# Nuxt SPA proxy - /tools/ -> :8999 Nuxt app
location /tools/ {
    proxy_pass http://127.0.0.1:8999;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve Nuxt _nuxt assets directly (SPA on /tools/ path can't load /_nuxt/ via proxy)
location /_nuxt/ {
    alias /usr/share/nginx/html/nuxt-tools/_nuxt/;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# Serve favicon for tools
location = /favicon.svg {
    alias /usr/share/nginx/html/nuxt-tools/favicon.svg;
    expires 7d;
}

# WebRTC signaling WebSocket proxy (keep on port 80)
location /ws {
    proxy_pass http://127.0.0.1:9200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
}
